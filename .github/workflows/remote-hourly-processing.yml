name: Remote hourly L2 preprocessing

on:
  schedule:
    - cron: "30 * * * *"

  workflow_dispatch:
    inputs:
      chain:
        description: "Remote processing chain"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - binance_btc
          - binance_eth
          - bybit_btc
          - bybit_eth
          - okx_btc
          - okx_eth

      hour:
        description: "Optional canonical UTC hour, for example 2026-09-14T12:00:00Z"
        required: false
        default: ""
        type: string

      catch_up_hours:
        description: "Bounded HF chain-frontier search when hour is omitted"
        required: true
        default: "720"
        type: string

      max_hours_per_run:
        description: "Maximum contiguous hours processed per catch-up run"
        required: true
        default: "24"
        type: string

      max_runtime_minutes:
        description: "Cooperative catch-up runtime budget in minutes"
        required: true
        default: "240"
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare remote chain matrix

    if: >-
      ${{
        github.event_name == 'workflow_dispatch'
        || vars.L2SHOCK_REMOTE_PROCESSING_ENABLED == 'true'
      }}

    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Build selected chain matrix
        id: matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_CHAIN: ${{ inputs.chain || 'all' }}
          BINANCE_SEEDS_READY: ${{ vars.L2SHOCK_BINANCE_SEEDS_READY || 'false' }}
          BYBIT_SEEDS_READY: ${{ vars.L2SHOCK_BYBIT_SEEDS_READY || 'false' }}
        run: |
          case "${SELECTED_CHAIN}" in
            all)
              if [[ "${EVENT_NAME}" == "schedule" ]] \
                 && [[ "${BINANCE_SEEDS_READY}" != "true" ]] \
                 && [[ "${BYBIT_SEEDS_READY}" != "true" ]]; then
                matrix='{"include":[{"chain":"okx_btc","venue":"okx_futures","instrument":"BTC-USDT-SWAP","publication_delay_seconds":0},{"chain":"okx_eth","venue":"okx_futures","instrument":"ETH-USDT-SWAP","publication_delay_seconds":45}]}'
              elif [[ "${EVENT_NAME}" == "schedule" ]] \
                   && [[ "${BINANCE_SEEDS_READY}" != "true" ]]; then
                matrix='{"include":[{"chain":"bybit_btc","venue":"bybit","instrument":"BTCUSDT","publication_delay_seconds":0},{"chain":"bybit_eth","venue":"bybit","instrument":"ETHUSDT","publication_delay_seconds":45},{"chain":"okx_btc","venue":"okx_futures","instrument":"BTC-USDT-SWAP","publication_delay_seconds":90},{"chain":"okx_eth","venue":"okx_futures","instrument":"ETH-USDT-SWAP","publication_delay_seconds":135}]}'
              elif [[ "${EVENT_NAME}" == "schedule" ]] \
                   && [[ "${BYBIT_SEEDS_READY}" != "true" ]]; then
                matrix='{"include":[{"chain":"binance_btc","venue":"binance_futures","instrument":"BTCUSDT","publication_delay_seconds":0},{"chain":"binance_eth","venue":"binance_futures","instrument":"ETHUSDT","publication_delay_seconds":45},{"chain":"okx_btc","venue":"okx_futures","instrument":"BTC-USDT-SWAP","publication_delay_seconds":90},{"chain":"okx_eth","venue":"okx_futures","instrument":"ETH-USDT-SWAP","publication_delay_seconds":135}]}'
              else
                matrix='{"include":[{"chain":"binance_btc","venue":"binance_futures","instrument":"BTCUSDT","publication_delay_seconds":0},{"chain":"binance_eth","venue":"binance_futures","instrument":"ETHUSDT","publication_delay_seconds":45},{"chain":"bybit_btc","venue":"bybit","instrument":"BTCUSDT","publication_delay_seconds":90},{"chain":"bybit_eth","venue":"bybit","instrument":"ETHUSDT","publication_delay_seconds":135},{"chain":"okx_btc","venue":"okx_futures","instrument":"BTC-USDT-SWAP","publication_delay_seconds":180},{"chain":"okx_eth","venue":"okx_futures","instrument":"ETH-USDT-SWAP","publication_delay_seconds":225}]}'
              fi
              ;;
            binance_btc)
              matrix='{"include":[{"chain":"binance_btc","venue":"binance_futures","instrument":"BTCUSDT","publication_delay_seconds":0}]}'
              ;;
            binance_eth)
              matrix='{"include":[{"chain":"binance_eth","venue":"binance_futures","instrument":"ETHUSDT","publication_delay_seconds":0}]}'
              ;;
            bybit_btc)
              matrix='{"include":[{"chain":"bybit_btc","venue":"bybit","instrument":"BTCUSDT","publication_delay_seconds":0}]}'
              ;;
            bybit_eth)
              matrix='{"include":[{"chain":"bybit_eth","venue":"bybit","instrument":"ETHUSDT","publication_delay_seconds":0}]}'
              ;;
            okx_btc)
              matrix='{"include":[{"chain":"okx_btc","venue":"okx_futures","instrument":"BTC-USDT-SWAP","publication_delay_seconds":0}]}'
              ;;
            okx_eth)
              matrix='{"include":[{"chain":"okx_eth","venue":"okx_futures","instrument":"ETH-USDT-SWAP","publication_delay_seconds":0}]}'
              ;;
            *)
              echo "Unsupported remote chain selection." >&2
              exit 2
              ;;
          esac

          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  process-hour:
    name: ${{ matrix.chain }}
    needs: prepare

    runs-on: ubuntu-24.04
    timeout-minutes: 350

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    concurrency:
      group: l2shock-remote-${{ matrix.chain }}
      cancel-in-progress: false
      queue: max

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      L2SHOCK_HF_REPO_ID: ${{ vars.L2SHOCK_HF_REPO_ID }}
      L2SHOCK_HF_REVISION: ${{ vars.L2SHOCK_HF_REVISION || 'main' }}
      TARGET_HOUR: ${{ inputs.hour || '' }}
      CATCH_UP_HOURS: ${{ inputs.catch_up_hours || vars.L2SHOCK_CATCH_UP_HOURS || '720' }}
      MAX_HOURS_PER_RUN: ${{ inputs.max_hours_per_run || vars.L2SHOCK_MAX_HOURS_PER_RUN || '24' }}
      MAX_RUNTIME_MINUTES: ${{ inputs.max_runtime_minutes || vars.L2SHOCK_MAX_RUNTIME_MINUTES || '240' }}
      DEPTH_LOWER: ${{ vars.L2SHOCK_DEPTH_LOWER || '0' }}
      DEPTH_UPPER: ${{ vars.L2SHOCK_DEPTH_UPPER || '0.01' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install project
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Stagger shared Hugging Face publication writers
        if: ${{ matrix.publication_delay_seconds > 0 }}
        shell: bash
        run: |
          echo "Delaying this chain by ${{ matrix.publication_delay_seconds }} seconds."
          sleep "${{ matrix.publication_delay_seconds }}"

      - name: Validate required private-dataset configuration
        shell: bash
        run: |
          if [[ -z "${HF_TOKEN}" ]]; then
            echo "HF_TOKEN GitHub Actions secret is not configured." >&2
            exit 2
          fi

          if [[ -z "${L2SHOCK_HF_REPO_ID}" ]]; then
            echo "L2SHOCK_HF_REPO_ID GitHub Actions variable is not configured." >&2
            exit 2
          fi

          if ! [[ "${CATCH_UP_HOURS}" =~ ^[1-9][0-9]*$ ]]; then
            echo "catch_up_hours must be a positive integer." >&2
            exit 2
          fi

          if ! [[ "${MAX_HOURS_PER_RUN}" =~ ^[1-9][0-9]*$ ]]; then
            echo "max_hours_per_run must be a positive integer." >&2
            exit 2
          fi

          if ! [[ "${MAX_RUNTIME_MINUTES}" =~ ^[1-9][0-9]*$ ]]; then
            echo "max_runtime_minutes must be a positive integer." >&2
            exit 2
          fi

      - name: Process and publish bounded remote catch-up
        shell: bash
        run: |
          args=(
            "--venue" "${{ matrix.venue }}"
            "--instrument" "${{ matrix.instrument }}"
            "--release-delay-minutes" "15"
            "--catch-up-hours" "${CATCH_UP_HOURS}"
            "--max-hours-per-run" "${MAX_HOURS_PER_RUN}"
            "--max-runtime-minutes" "${MAX_RUNTIME_MINUTES}"
            "--depth-lower" "${DEPTH_LOWER}"
            "--depth-upper" "${DEPTH_UPPER}"
            "--hf-repo-id" "${L2SHOCK_HF_REPO_ID}"
            "--hf-revision" "${L2SHOCK_HF_REVISION}"
          )

          if [[ -n "${TARGET_HOUR}" ]]; then
            args+=("--hour" "${TARGET_HOUR}")
          fi

          python -m l2shock.remote_worker "${args[@]}"